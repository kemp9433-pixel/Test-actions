name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            if [ ! -d /opt/bot ]; then
              git clone https://github.com/kemp9433-pixel/Test-actions.git /opt/bot
            fi
            cd /opt/bot
            git pull origin main
            docker build -t time-api .
            docker rm -f time-api || true
            docker run -d --name time-api --restart unless-stopped -p 8090:8000 time-api